name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookrelay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hookrelay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/api
      - run: npm run typecheck -w apps/api
      - run: npm run test:coverage -w apps/api
      - run: npm run build -w apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: ignore

  web:
    name: Dashboard (types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/web
      - run: npm run build -w apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  n8n-workflows:
    name: n8n workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and node connections
        run: |
          for f in n8n/workflows/*.json; do
            node -e '
              const wf = require(process.argv[1]);
              const names = new Set(wf.nodes.map(n => n.name));
              for (const [src, c] of Object.entries(wf.connections))
                for (const branch of c.main) for (const t of branch)
                  if (!names.has(src) || !names.has(t.node)) throw new Error(`${process.argv[1]}: broken link ${src} -> ${t.node}`);
              const leaked = JSON.stringify(wf).match(/(sk_live_|xox[bp]-|SG\.[\w-]{20,}|pat-[a-z]{2}\d-)/);
              if (leaked) throw new Error(`${process.argv[1]}: looks like a hard-coded secret`);
              console.log(`ok ${process.argv[1]} (${wf.nodes.length} nodes)`);
            ' "$PWD/$f"
          done

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
